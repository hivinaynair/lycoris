name: Check

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, boundaries, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Feature-folder boundaries
        run: bun run check-boundaries

      - name: Semantic tokens
        run: bun run check-tokens

      - name: Types
        run: bun run check-types

      - name: Unit tests
        run: bun test

      - name: Pack SDK and check independent consumers
        run: bun run pack:settle-kit && bun run check:settle-kit-package

      - name: Install browser
        run: bun run --cwd e2e/web e2e:install --with-deps

      - name: Independent Next.js checkout smoke
        run: bun run smoke:settle-kit "$GITHUB_WORKSPACE/dist/settle-kit"
